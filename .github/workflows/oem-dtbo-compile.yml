name: Compile OEM mondrian Cape DTB and board DTBO

on:
  push:
    branches: [bringup/a17-mondrian-oem-bsp-20261111]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oem-dtb:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Confirm manufacturer DTS revision and source contracts
        run: |
          set -euo pipefail
          test "$(git -C upstream/xiaomi-dts rev-parse HEAD)" = 34e6cc7d832ed9c655b9d79bc3ffe1d625146b7c
          python3 -m unittest discover -s tests -v
      - uses: actions/checkout@v4
        with:
          repository: PixelExperience-Reborn/android_kernel_xiaomi_sm8450
          ref: 2466406b9beac724960b0c88e6e794421d0466e7
          path: kernel
          persist-credentials: false
      - name: Install Device Tree tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends device-tree-compiler gcc
      - name: Compile Cape DTBs and mondrian board overlay
        run: python3 tools/build_oem_dtbo.py --kernel kernel --out /tmp/mondrian-dt
      - name: Retain preprocessed DTS if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mondrian-dtb-build-inputs
          path: /tmp/mondrian-dt/*.preprocessed.dts
          if-no-files-found: ignore
          retention-days: 5
